<a class="skip" href="#main">Skip to content</a>

<header class="bar">
  <div class="wrap bar-inner">
    <a routerLink="/" class="brand" aria-label="Vishal Narayan Singh, home">
      <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="var(--accent)" />
        <path d="M14 16l18 32 18-32" fill="none" stroke="var(--signal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>{{ name }}</span>
    </a>

    <nav [class.open]="menuOpen" aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="menuOpen = false">Home</a>
      <a routerLink="/" fragment="experience" (click)="menuOpen = false">Experience</a>
      <a routerLink="/projects" routerLinkActive="active" (click)="menuOpen = false">Projects</a>
      <a routerLink="/" fragment="contact" (click)="menuOpen = false">Contact</a>
    </nav>

    <div class="actions">
      <button type="button" class="icon-btn" (click)="toggleTheme()" [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
        @if (theme === 'dark') {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        }
      </button>

      <button type="button" class="icon-btn menu" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <p>&copy; {{ year }} {{ name }}</p>
    <p class="links">
      <a [href]="github" target="_blank" rel="noopener">GitHub</a>
      <a [href]="linkedin" target="_blank" rel="noopener">LinkedIn</a>
      <a [href]="'mailto:' + email">Email</a>
      <!-- <a [href]="resume" download>Resume</a> -->
       <a [href]="resume" download="Vishal_Narayan_Singh_Resume.pdf">Resume</a>
    </p>
  </div>
</footer>
